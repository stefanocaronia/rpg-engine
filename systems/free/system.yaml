# Free play, without a game system (D-307, D-489 (7)): a sheet of words and no numbers; what happens is the story's, the dice only when the player asks for them.
# A book, a module or notes imported into a campaign of this system give an adventure that needs no system.
title: free play, without a game system
language: en
fields:
  concept: text
  abilities: list
sheet:
  Character: [concept, abilities, factions?]
  Equipment: [money?, inventory?]
sheet-headline: "{concept}"
sheet-cards:
  at-hand: [abilities]
# The player tries an ability, and uses a thing (D-521): the master rules what comes of it.
sheet-actions: {abilities: [try], inventory: [use]}
sheet-verbs:
  try:
    label: Try
    title: "Try {item}"
    says: "I try {item}."
    says-on: "I try {item} on {target}."
    says-at: "I try {item} at {square}."
    says-self: "I try {item} on myself."
sheet-notes:
  Character: "concept is who the character is, in one line, in the player's words; abilities, three to five things they do well, also in the player's words, such as [sailing, reading people, the long knife]: what they do with them succeeds when the story allows it."
# How what happens is decided, asked in the setup (D-522): the master's part for each is instructions/outcomes-<value>.md, and the die of the campaign is
# asked only where the dice decide. A story without dice has no lethality by the dice (DAT-16).
settings:
  outcomes:
    about: how what happens is decided
    told:
      means: "the story decides: the player never rolls, and you tell what comes of what they try; your 1d100 on the world only hidden"
      player: "only choices, no dice: the master tells what comes of them"
      engine-settings: {lethality: [narrative, epic], dice: [digital], master-rolls: [behind the screen]}
    rolled:
      means: "the dice decide too: each roll of the player's is one die of the campaign, the die setting, with the number it needs said before"
      player: "choices, and one die when something is at stake"
      asks: [die]
      suggested: true
    tossed:
      means: "fate says yes or no: no dice, the player asks the coins, heads or tails, with roll toss"
      player: "no dice: coins, heads or tails, answer yes or no"
  die:
    about: the one die of your rolls
    d6: {means: "a d6 for each roll of the player's", player: "a six-sided die: simple and quick", suggested: true}
    d20: {means: "a d20 for each roll of the player's", player: "a twenty-sided die, as many games use"}
# Free play counts no food, light or fatigue by the rules: how scarce things are, the difficulty says (D-522).
engine-settings:
  rigor: [smooth]
