name: Take a shared note back from the master
covers: [note-share]
setup: {}
steps:
  - tapOn: Journal
  - tapOn: Notes
  - tapOn: New note
  - inputText: {into: {label: "The note's title"}, text: Il mercante}
  - inputText: {into: {label: The note Il mercante}, text: "Secondo me il mercante dei sigilli lavora per i rapitori."}
  - tapOn: {label: Share with the master}
  - tapOn: {label: Take it back from the master}
  - assertState: {query: news, notContains: lavora per i rapitori}
