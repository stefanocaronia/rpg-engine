name: Take back a sentence before the master hears it
covers: [act-strip]
setup: {bell: true, busy: true}   # the master is answering: the sentence waits for their call, and can be taken back
steps:
  - phone: {tapOn: Spells}   # on a phone the lists of the Combat card start closed
  - tapOn: Cast Healing Word
  - tapOn: Tell the master
  - assertVisible: Said to the master
  - tapOn: {label: Take it back from the master}
  - assertNotVisible: {label: Take it back from the master}
  - assertState: {query: news, notContains: Healing Word}
