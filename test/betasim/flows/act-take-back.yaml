name: Take back a sentence before the master hears it
covers: [act-strip]
# On the 5e's demo, whose sheet has spells; the master is answering: the sentence waits for their call, and can be taken back.
setup: {bell: true, busy: true, system: 5e}
steps:
  - phone: {tapOn: Spells}   # on a phone the lists of the Combat card start closed
  - tapOn: {text: Healing Word, within: Prepared}
  - tapOn: {css: "button[data-verb=cast]"}   # Cast, among the card's verbs
  - tapOn: {css: ".act-who-one.plain", index: 1}   # No one in particular, in the list On whom
  - tapOn: I cast Healing Word   # the button says the whole action, and sends it (D-581)
  - assertVisible: Said to the master
  - tapOn: {label: Take it back from the master}
  - assertNotVisible: {label: Take it back from the master}
  - assertState: {query: news, notContains: Healing Word}
